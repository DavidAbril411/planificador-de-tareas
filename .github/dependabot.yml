version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencias:
        patterns: ["*"]
    ignore:
      # Radon 6 necesita mando menor a 0.8.
      - dependency-name: mando
        versions: [">=0.8"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
